name: Download and Upload Kernel Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      KERNEL_TAG: android14-6.1-2026-06_r1
      RELEASE_TAG: kernel-archive-android14-6.1-2026-06_r1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git tar gzip

      - name: Download and upload kernel archive
        run: |
          set -euo pipefail

          KERNEL_URL="https://android.googlesource.com/kernel/common/+archive/refs/tags/${KERNEL_TAG}.tar.gz"
          KERNEL_FILE="common-${KERNEL_TAG}.tar.gz"
          SHA_FILE="${KERNEL_FILE}.sha256"

          echo "Kernel tag: ${KERNEL_TAG}"
          echo "Kernel URL: ${KERNEL_URL}"
          echo "Output file: ${KERNEL_FILE}"

          echo "Downloading kernel archive with wget..."
          if wget \
            --tries=10 \
            --waitretry=20 \
            --timeout=120 \
            --retry-connrefused \
            --retry-on-http-error=429,500,502,503,504 \
            --user-agent="Mozilla/5.0 GitHub-Actions" \
            -O "${KERNEL_FILE}" \
            "${KERNEL_URL}"; then
            echo "wget download succeeded."
          else
            echo "wget archive download failed. Falling back to git clone..."

            rm -f "${KERNEL_FILE}"
            rm -rf common-src

            git clone \
              --depth=1 \
              --branch="${KERNEL_TAG}" \
              https://android.googlesource.com/kernel/common.git \
              common-src

            tar \
              --exclude='.git' \
              -czf "${KERNEL_FILE}" \
              -C common-src .

            rm -rf common-src
          fi

          echo "Downloaded archive:"
          ls -lh "${KERNEL_FILE}"

          echo "Verifying tar.gz archive..."
          tar -tzf "${KERNEL_FILE}" > /dev/null

          echo "Generating SHA256..."
          sha256sum "${KERNEL_FILE}" | tee "${SHA_FILE}"

          echo "Checking or creating release: ${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release already exists: ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" \
              --title "Kernel Archive ${KERNEL_TAG}" \
              --notes "Automated upload of Android GKI common kernel source archive: ${KERNEL_TAG}"
          fi

          echo "Uploading release assets..."
          gh release upload "${RELEASE_TAG}" \
            "${KERNEL_FILE}" \
            "${SHA_FILE}" \
            --clobber

          echo "Done."
