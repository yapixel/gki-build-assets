name: Download and Upload Kernel Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      KERNEL_TAG: android14-6.1-2026-03_r13
      RELEASE_TAG: android14-6.1-2026-03_r13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 tar gzip

      - name: Download and upload kernel archive
        run: |
          set -e

          KERNEL_URL="https://android.googlesource.com/kernel/common/+archive/refs/tags/${KERNEL_TAG}.tar.gz"
          KERNEL_FILE="common-${KERNEL_TAG}.tar.gz"
          SHA_FILE="${KERNEL_FILE}.sha256"

          echo "Downloading kernel tag: ${KERNEL_TAG}"
          echo "URL: ${KERNEL_URL}"

          aria2c \
            -s16 \
            -x16 \
            -k1M \
            --allow-overwrite=true \
            -o "${KERNEL_FILE}" \
            "${KERNEL_URL}"

          echo "Downloaded file:"
          ls -lh "${KERNEL_FILE}"

          echo "Verifying archive..."
          tar -tzf "${KERNEL_FILE}" > /dev/null

          echo "Generating checksum..."
          sha256sum "${KERNEL_FILE}" | tee "${SHA_FILE}"

          echo "Checking or creating release: ${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release already exists: ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" \
              --title "Kernel Archive ${KERNEL_TAG}" \
              --notes "Automated upload of Android GKI common kernel source archive: ${KERNEL_TAG}"
          fi

          echo "Uploading assets..."
          gh release upload "${RELEASE_TAG}" \
            "${KERNEL_FILE}" \
            "${SHA_FILE}" \
            --clobber

          echo "Done."
