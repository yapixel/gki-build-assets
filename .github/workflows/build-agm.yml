name: Build AGM

on:
  workflow_dispatch:

jobs:
  build-linux-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AGM
        uses: actions/checkout@v4
        with:
          repository: shyim/agm
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Build AGM
        run: |
          set -euxo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" -o agm .

          file agm
          sha256sum agm > agm.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agm-linux-arm64
          path: |
            agm
            agm.sha256
          if-no-files-found: error
          retention-days: 7
